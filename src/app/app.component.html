<main>
  <nav class="app-navigation" aria-label="Основная навигация">
    <button type="button" [class.active]="view === 'activities'" (click)="view = 'activities'">
      <span aria-hidden="true">▦</span> Активности
    </button>
    <button type="button" [class.active]="view === 'calendar'" (click)="view = 'calendar'">
      <span aria-hidden="true">▣</span> Календарь
    </button>
  </nav>

  @if (view === 'activities') {
    <app-activity-list></app-activity-list>
  } @else {
    <app-calendar></app-calendar>
  }
</main>
